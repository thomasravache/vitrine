# SPEC-0005 — overrides do Compose da aplicação, iguais no servidor e no ambiente local prod-like.
#   migrate  : one-shot da mesma imagem com `--migrate` (ADR-0011); roda só via `docker compose run`.
#   caddy    : HTTPS na frente da API (Let's Encrypt no servidor; CA interna para *.localhost).
#   proxy    : rede só do Caddy e da API, com sub-rede fixa (PROXY_SUBNET): a API aceita X-Forwarded-* só dela (SPEC-0008).
#   postgres : banco em container (perfil `db-container`): ambiente local e staging; produção usa o PostgreSQL gerenciado.
#   alloy    : Grafana Alloy (perfil `observability`, SPEC-0007): métricas do host para o Grafana Cloud. Não sobe
#              sem o perfil — o ambiente local não tem credenciais (COMPOSE_PROFILES=db-container,observability liga).
services:
  api:
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # default: banco (e migrate); proxy: o único caminho do Caddy até a API.
    networks:
      - default
      - proxy

  migrate:
    image: ${IMAGE_REPO:-vitrine-api}:${IMAGE_TAG:?IMAGE_TAG não definido (deploy/deploy.sh grava no .env)}
    command: ["--migrate"]
    restart: "no"
    profiles: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__vitrine: ${DB_CONNECTION_STRING:?DB_CONNECTION_STRING não definido}
      # Rotação da chave mestra (SPEC-0008): com a anterior definida, o --migrate recifra o anel de chaves com a atual.
      DataProtection__MasterKey: ${DATA_PROTECTION_MASTER_KEY:-}
      DataProtection__PreviousMasterKey: ${DATA_PROTECTION_PREVIOUS_MASTER_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS não definido}
    # Só na rede do proxy: toda conexão do Caddy com a API sai de PROXY_SUBNET (forwarded headers confiáveis).
    networks:
      - proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    profiles: ["db-container"]
    environment:
      POSTGRES_DB: vitrine
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD não definido}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrine -d vitrine"]
      interval: 2s
      timeout: 3s
      retries: 30

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    # Rede do host: métricas de rede reais do droplet (/proc/net segue o namespace de rede); nenhuma porta publicada.
    # Sem `pid: host`: os coletores leem /proc do host montado em /host/proc.
    network_mode: host
    environment:
      # Credenciais do Grafana Cloud (secrets do Environment); vazias fora do perfil, que só é ligado com elas.
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:-}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
      DEPLOY_ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-local}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Propriedades udev dos discos (rótulos do coletor diskstats).
      - /run/udev/data:/run/udev/data:ro
      - alloy_data:/var/lib/alloy/data

networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-10.250.0.0/24}

volumes:
  alloy_data:
  caddy_data:
  caddy_config:
  postgres_data:
